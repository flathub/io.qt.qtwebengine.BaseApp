name: Check for updates
on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch: {}
jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'flathub'
    strategy:
      matrix:
        branch: [ branch/5.15-25.08, branch/6.10, branch/6.11 ]
    steps:
        # 7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.branch }}
      - uses: docker://ghcr.io/flathub-infra/flatpak-external-data-checker:latest@sha256:201790eb2aec873310766906e09209d29b9cea7582607a72ab3afcb57ae78f99
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork --require-important-update io.qt.qtwebengine.BaseApp.json
